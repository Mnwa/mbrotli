name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A differential failure is worth the full backtrace it takes to place.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `--locked` is deliberately absent: this is a library, so `Cargo.lock`
      # is not committed and a fresh checkout has none to honour. The
      # repository's own checks use it because a working tree has one.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --allow-dirty

  semver:
    name: public API semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: mbrotli
          # Check the stable API against the latest published release.
          # Experimental APIs may change even in a patch release.
          feature-group: default-features

  test:
    name: test on ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and AArch64 both actually execute here, which is what makes the
        # backend-identity tests evidence rather than a compile check.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        toolchain: [stable]
        include:
          # The MSRV `Cargo.toml` declares, checked on one target.
          - os: ubuntu-latest
            toolchain: "1.89"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # The default feature set is what a dependant gets, and the full one is
      # what the tests need; both have to build.
      - run: cargo test --workspace --release
      - run: cargo test --workspace --all-features --release
      # The experimental surface on its own, so a dependant who enables only it
      # is covered by the same run.
      - run: cargo test --workspace --features experimental --release

  fuzz:
    name: fuzz targets and their regression corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz/afl
      # A cached executable may refer to bundled sources absent from this runner.
      # Reinstall to restore its dependencies and rebuild against local paths.
      - name: install cargo-afl
        run: cargo install cargo-afl --version 0.18.2 --locked --force
      # rust-cache can restore cargo-afl without the active compiler's runtime.
      # --force also makes this succeed when a fresh install built it already.
      - name: build AFL runtime for the active Rust toolchain
        run: cargo afl config --build --force
      - name: check
        working-directory: fuzz/afl
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      # `cargo afl test` rather than `cargo test`: the fuzz binaries link AFL's
      # runtime, so plain `cargo test` cannot link them. It replays the
      # committed regression corpus through the target bodies.
      - name: replay the regression corpus
        working-directory: fuzz/afl
        run: cargo afl test
