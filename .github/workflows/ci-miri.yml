name: CI Miri

# Run for every pushed tag, or on demand from Actions / the GitHub CLI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  miri:
    name: interpreter checks for retained storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Filters name modules rather than single tests: a renamed test would
      # leave a single-name filter matching nothing, and `cargo miri test`
      # exits successfully when it runs no tests at all. A filter is a
      # substring, so check it does not also match an unrelated module.
      - run: cargo miri test --lib shared::ringbuffer::tests
      - run: cargo miri test --lib compressor::core::hq::zopfli::tests::prefix_merge_preserves_prior_arena_entries_and_tree_ties
      # The skipped test checks the sparse-to-dense layout policy, not memory
      # safety, and fills an 8 MiB dense table twice: under Miri it alone takes
      # longer than the other 46 hasher tests together. The dense table's
      # retained blocks stay covered by
      # `a_dense_table_keeps_its_blocks_and_clears_only_its_counters`.
      - run: cargo miri test --lib compressor::core::greedy::hashers::tests -- --skip a_deep_shape_takes_the_dense_table_once_it_is_reused
      - run: cargo miri test --lib compressor::core::fast::workspace::tests
      # `compressor::core::stream::tests` is also a substring of
      # `decompressor::core::stream::tests`, whose golden and ring-boundary
      # tests take hours under Miri; skip them.
      - run: cargo miri test --lib compressor::core::stream::tests -- --skip decompressor::

      - run: cargo miri test --test decompress_golden
      - run: cargo miri test --test decompress_golden --features experimental

      - run: cargo miri test --lib --features experimental decompressor::framing::core::wire::tests
