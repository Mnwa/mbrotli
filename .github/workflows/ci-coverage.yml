name: CI Coverage

# Run on demand from the Actions tab or the GitHub CLI.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: function coverage
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: clean previous coverage artifacts
        run: cargo llvm-cov clean --workspace
      - name: run instrumented tests
        env:
          # rust-cache exports 0. At opt-level=1 that enables automatic
          # cross-crate inlining, which can lose small API coverage counters.
          # A step override keeps coverage codegen consistent with local runs.
          CARGO_INCREMENTAL: "1"
        run: cargo llvm-cov --workspace --features experimental,diagnostics,hotpath-cpu,hotpath-alloc --locked --no-report
      - name: exercise no_std overrides in the same coverage report
        env:
          CARGO_INCREMENTAL: "1"
        run: cargo llvm-cov --workspace --all-features --locked --lib --test no_std --no-report
      - name: enforce function coverage
        run: cargo llvm-cov report --workspace --fail-under-functions 100
      - name: render coverage report
        if: always()
        run: cargo llvm-cov report --workspace --html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-coverage
          path: target/llvm-cov/html
