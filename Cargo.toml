[package]
name = "mbrotli"
version = "0.1.0"
edition = "2024"

[dependencies]

[dependencies.fearless_simd]
version = "0.7"
features = ["libm"]

[dependencies.thiserror]
version = "2"

[dependencies.hotpath]
version = "0.24"

[dev-dependencies]

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.google-brotli-ffi]
path = "brotli-ffi"

[[bench]]
name = "compress"
harness = false

[features]
hotpath = ["hotpath/hotpath"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[workspace]
members = ["brotli-ffi"]
resolver = "3"
