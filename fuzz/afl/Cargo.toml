[package]
name = "mbrotli-afl"
version = "0.1.0"
edition = "2024"
publish = false
description = "AFL++ fuzz targets for the mbrotli quality 0 to 11 encoders"

[dependencies]
afl = "0.18"

[dependencies.mbrotli]
path = "../.."

[dependencies.google-brotli-ffi]
path = "../../brotli-ffi"

[features]
default = []
# Enable the RFC 9841 targets and their independent C parser/decoder oracle.
experimental = ["mbrotli/experimental", "google-brotli-ffi/experimental"]

[[bin]]
name = "serialized_dictionary"
path = "src/bin/serialized_dictionary.rs"
required-features = ["experimental"]

[[bin]]
name = "framing"
path = "src/bin/framing.rs"
required-features = ["experimental"]

[profile.release]
debug = true
codegen-units = 1

[[bin]]
name = "decode_serialized"
path = "src/bin/decode_serialized.rs"
required-features = ["experimental"]
