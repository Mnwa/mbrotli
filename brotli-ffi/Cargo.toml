[package]
name = "google-brotli-ffi"
version = "0.1.0"
edition = "2024"
links = "brotli"
license = "MIT"
description = "Raw Rust FFI bindings to Google's Brotli C library"
homepage = "https://github.com/google/brotli"
include = [
    "src/**",
    "build.rs",
    "README.md",
    "UPSTREAM_VERSION",
    "vendor/brotli/LICENSE",
    "vendor/brotli/c/common/**",
    "vendor/brotli/c/dec/**",
    "vendor/brotli/c/enc/**",
    "vendor/brotli/c/include/**",
]

[features]
# Compiles the vendored library with `BROTLI_EXPERIMENTAL`, which is what the
# reference gates its RFC 9841 serialized shared dictionary parser behind. The
# flag adds the parser, custom static dictionary construction, and one search
# branch that only a dictionary with custom transforms can reach; it changes
# nothing an ordinary compression does, which the byte-identity suite checks.
experimental = []

[build-dependencies]
cc = "1.2"
